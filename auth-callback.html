<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Signing in…</title>
  <style>body{font:17px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#6e6e73}@media(prefers-color-scheme:dark){body{background:#000;color:#a1a1a6}}</style>
</head>
<body>
  <p>Signed in. You can close this window.</p>
  <script>
    // Hand the authorisation response to the page that opened this window, then close.
    if (window.opener) {
      window.opener.postMessage({ type: 'cw-oauth', search: location.search }, location.origin);
      window.close();
    }
  </script>
</body>
</html>
